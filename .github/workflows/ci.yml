# SOURCE OF TRUTH KEYWORDS: ci, cargo test, clippy, tsc, layering, release build
# WHAT:  Runs on every push and pull request: the Rust suite, clippy at deny
#        level, the TypeScript typecheck, and a real release build.
# WHY:   Until this file existed NOTHING ran on push, while docs/05 §5 claimed
#        "CI enforces this — an upward import fails the build rather than being
#        caught in review." Several of this project's guardrails are written as
#        tests — reachability, layering, the no-runtime constructor check — and
#        a test nobody runs is a comment. This is what turns them into gates.
#
#        The release build is here on purpose rather than only on a tag. A build
#        that compiles for `cargo test` can still fail to bundle, and finding
#        that out at release time means finding it out when someone is waiting.
#        It is the slowest job, so it runs in parallel with the fast ones rather
#        than after them.
#
#        No caching of the Rust target directory on the first pass: whisper-rs
#        builds a large C++ dependency and a stale cache is a confusing failure.
#        Correctness first; if the job becomes too slow, cache `~/.cargo` before
#        caching `target/`.
#        DELIBERATELY ABSENT: `cargo fmt --check`. The crate does not currently
#        satisfy rustfmt — the diff spans files nobody is working on — and a
#        pipeline that is red on the day it lands teaches everyone to ignore it.
#        Adding the gate means reformatting the crate in one commit first, which
#        is a change worth making on its own and not alongside anything else.
# WHERE: Complements release.yml, which builds and signs on a `v*` tag.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch: the newest push is the one that
# matters, and a queue of stale builds hides the result that counts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — clippy and tests
    # macOS because the crate is macOS-only: it links CoreGraphics, AppKit and
    # Carbon, and the adapters do not compile anywhere else. A linux runner
    # would be cheaper and would not build.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Deny level. A warning that is allowed to accumulate is a warning nobody
      # reads, and this project treats clippy as a gate rather than advice.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # This is the step that enforces the architecture. The suite carries the
      # reachability check (every setting and metric is read by something), the
      # layering check (nothing imports upward), and the constructor check (no
      # work scheduled before the async runtime exists).
      #
      # The engine tests self-skip when the 574MB model is absent, which it is
      # here — that is deliberate, so CI stays green for an environmental reason
      # rather than red for one.
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The bindings are generated BY a test. If running the suite changes them,
      # someone altered a command or an event without regenerating, and the
      # frontend is compiling against a contract the backend no longer has.
      - name: Generated bindings are current
        run: git diff --exit-code -- src/lib/bindings.ts

  frontend:
    name: Frontend — typecheck and build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm exec vite build

  bundle:
    name: Release build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Unsigned and un-notarized: this job answers "does it still bundle",
      # which is a different question from "is it shippable". release.yml signs.
      #
      # TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be SET even when empty — unset
      # makes Tauri prompt, and on a runner stdin is closed, which surfaces as
      # "incorrect updater private key password: Device not configured" and
      # sends you hunting a password that does not exist.
      - name: Bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm exec tauri build --bundles app
